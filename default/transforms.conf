# -----------------------------------------------------------------------------
# System fields
# -----------------------------------------------------------------------------

[sysmon-eventid]
REGEX = <EventID>(\d+)</EventID>
FORMAT = EventID::$1

[sysmon-version]
REGEX = <Version>(\d+)</Version>
FORMAT = Version::$1

[sysmon-level]
REGEX = <Level>(\d+)</Level>
FORMAT = Level::$1

[sysmon-task]
REGEX = <Task>(\d+)</Task>
FORMAT = Task::$1

[sysmon-keywords]
REGEX = <Keywords>(0x[0-9a-fA-F]+)</Keywords>
FORMAT = Keywords::$1

[sysmon-eventrecordid]
REGEX = <EventRecordID>(\d+)</EventRecordID>
FORMAT = EventRecordID::$1

[sysmon-channel]
REGEX = <Channel>(.*?)</Channel>
FORMAT = Channel::$1

[sysmon-computer]
REGEX = <Computer>(.*?)</Computer>
FORMAT = Computer::$1

[sysmon-userid]
REGEX = <Security UserId="(.*?)"/>
FORMAT = UserId::$1

[sysmon-execution-processid]
REGEX = <Execution ProcessID="(\d+)"
FORMAT = Execution_ProcessID::$1

[sysmon-execution-threadid]
REGEX = <Execution ProcessID="\d+" ThreadID="(\d+)"
FORMAT = Execution_ThreadID::$1


# -----------------------------------------------------------------------------
# Common EventData fields
# -----------------------------------------------------------------------------

[sysmon-rulename]
REGEX = <Data Name="RuleName">(.*?)</Data>
FORMAT = RuleName::$1

[sysmon-utctime]
REGEX = <Data Name="UtcTime">(.*?)</Data>
FORMAT = UtcTime::$1

[sysmon-processguid]
REGEX = <Data Name="ProcessGuid">(.*?)</Data>
FORMAT = ProcessGuid::$1

[sysmon-processid]
REGEX = <Data Name="ProcessId">(.*?)</Data>
FORMAT = ProcessId::$1

[sysmon-image]
REGEX = <Data Name="Image">(.*?)</Data>
FORMAT = Image::$1

[sysmon-user]
REGEX = <Data Name="User">(.*?)</Data>
FORMAT = User::$1

[sysmon-device]
REGEX = <Data Name="Device">(.*?)</Data>
FORMAT = Device::$1


