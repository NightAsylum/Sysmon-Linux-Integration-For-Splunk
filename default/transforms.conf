# -----------------------------------------------------------------------------
# MITRE ATT&CK
# -----------------------------------------------------------------------------

[sysmon-techniqueid]
REGEX = <Data Name="RuleName">[^<]*TechniqueID=([^,]+)
FORMAT = TechniqueID::$1

[sysmon-techniquename]
REGEX = <Data Name="RuleName">[^<]*TechniqueName=([^<]+)</Data>
FORMAT = TechniqueName::$1


# -----------------------------------------------------------------------------
# Hashes
# -----------------------------------------------------------------------------

[sysmon-hashes]
REGEX = <Data Name="(?:Hashes|ConfigurationFileHash)">[^<]*MD5=(?:[^,]*),SHA256=([A-Fa-f0-9]{64})
FORMAT = SHA256::$1


# -----------------------------------------------------------------------------
# EventID lookup
# -----------------------------------------------------------------------------

[sysmon-eventid-lookup]
default_match = Unknown
filename = sysmon_for_linux_eventid.csv
min_matches = 1